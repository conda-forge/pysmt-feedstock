{% set name = "pysmt" %}
{% set version = "0.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/pysmt/pysmt/archive/v{{ version }}.tar.gz
  sha256: 8d5cff5b46bdf3e3034412b3e64b96be37951e923b540a849db5aef165eed92f

build:
  entry_points:
    - pysmt-install = pysmt.cmd.install:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}

test:
  imports:
    - pysmt
  commands:
    - pip check
    - pysmt-install --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://www.pysmt.org
  summary: A library for SMT formulae manipulation and solving
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  dev_url: https://github.com/pysmt/pysmt

extra:
  recipe-maintainers:
    - BastianZim
